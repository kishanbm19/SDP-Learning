
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        main {
            width: 100%;
            max-width: 550px;
            padding: 30px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 32px;
            color: #4f46e5;
        }

        #task-form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        #task-input {
            flex: 1;
            min-width: 0;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
        }

        #task-input:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        #task-list {
            margin-bottom: 20px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            background: #f3f4f6;
            border-left: 4px solid #667eea;
        }

        .task-title {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .task-done {
            text-decoration: line-through;
            color: #15803d;
        }

        .task-button {
            padding: 7px 10px;
            font-size: 12px;
        }

        .delete-button {
            background: #dc2626;
        }

        .container {
            width: 100%;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            margin-top: 10px;
            border-radius: 12px;
            background: #f5f3ff;
            color: #4f46e5;
            font-size: 14px;
            font-weight: bold;
        }

        #message {
            width: 100%;
            font-size: 14px;
            font-weight: normal;
            color: #15803d;
        }

        @media (max-width: 480px) {
            main {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            #task-input {
                flex-basis: 100%;
            }

            #task-form > button {
                width: 100%;
            }

            .container {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>Task App</h1>
        </header>

        <div id="task-list"></div>

        <form id="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task"
                maxlength="100"
                required
            >
            <button type="submit">Add Task</button>

            <div class="container">
                <span id="total-tasks">Total Tasks: 0</span>
                <span id="completed-tasks">Completed Tasks: 0</span>
                <p id="message" role="status"></p>
            </div>
        </form>
    </main>

    <script>
        const form = document.getElementById("task-form");
        const input = document.getElementById("task-input");
        const taskList = document.getElementById("task-list");
        const totalTasks = document.getElementById("total-tasks");
        const completedTasks = document.getElementById("completed-tasks");
        const message = document.getElementById("message");

        let count = 0;
        let completedCount = 0;

        function updateCounts() {
            totalTasks.textContent = `Total Tasks: ${count}`;
            completedTasks.textContent = `Completed Tasks: ${completedCount}`;
        }

        function taskadd(event) {
            event.preventDefault();

            const taskText = input.value.trim();

            if (taskText === "") {
                return;
            }

            const task = document.createElement("div");
            task.className = "task";

            const title = document.createElement("span");
            title.className = "task-title";
            title.textContent = taskText;

            const completeButton = document.createElement("button");
            completeButton.type = "button";
            completeButton.className = "task-button";
            completeButton.textContent = "Complete";

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.className = "task-button delete-button";
            deleteButton.textContent = "Delete";

            completeButton.addEventListener("click", function () {
                const isCompleted = title.classList.toggle("task-done");

                if (isCompleted) {
                    completedCount++;
                    completeButton.textContent = "Undo";
                } else {
                    completedCount--;
                    completeButton.textContent = "Complete";
                }

                updateCounts();
            });

            deleteButton.addEventListener("click", function () {
                if (title.classList.contains("task-done")) {
                    completedCount--;
                }

                count--;
                task.remove();
                updateCounts();
                message.textContent = "Task deleted.";
            });

            task.append(title, completeButton, deleteButton);
            taskList.appendChild(task);

            count++;
            updateCounts();

            input.value = "";
            message.textContent = "Task added successfully.";
            input.focus();
        }

        form.addEventListener("submit", taskadd);
    </script>
</body>
</html>
